<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast OCR Test</title><style>body{font:16px system-ui;margin:0;background:#111827;color:white}header,.controls,.results{padding:16px}h1{font-size:21px}video{width:100%;max-height:65vh;background:black}button{font:inherit;padding:12px 20px;margin-right:10px}#result{font-size:24px;font-weight:bold}small{color:#cbd5e1}</style></head><body><header><h1>Fast OCR Test</h1><small>Independent speed test — the main camera app is unchanged.</small></header><video id="camera" autoplay muted playsinline></video><div class="controls"><button id="start">Start camera</button><button id="stop" disabled>Stop</button></div><div class="results"><p id="status">Ready</p><p id="result">—</p><p id="time">First OCR text: —</p><small>Experimental local OCR. Displays raw OCR output, including kanji. No server-side image uploads.</small></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const el=id=>document.getElementById(id);let worker=null,stream=null,active=false,serial=0,started=0,first=false;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const japanese=/[\u3040-\u30ff\u3400-\u9fff]/;
async function recognize(id){if(!active||id!==serial)return;try{if(!worker){el('status').textContent='Loading Japanese OCR…';worker=await Tesseract.createWorker('jpn',1);await worker.setParameters({tessedit_pageseg_mode:'11'})}if(!active||id!==serial)return;const v=el('camera');const scale=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight));canvas.width=Math.max(1,Math.round(v.videoWidth*scale));canvas.height=Math.max(1,Math.round(v.videoHeight*scale));ctx.drawImage(v,0,0,canvas.width,canvas.height);const t=performance.now();const r=await worker.recognize(canvas);if(!active||id!==serial)return;const raw=(r.data.text||'').trim();const lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean);const matched=lines.find(line=>japanese.test(line));if(lines.length){el('result').textContent=matched||lines[0];if(!first){first=true;el('time').textContent='First OCR text: '+((performance.now()-started)/1000).toFixed(2)+' seconds'}}else{el('result').textContent='No text detected (OCR returned empty text)'}el('status').textContent='OCR: '+Math.round(performance.now()-t)+' ms · '+lines.length+' lines';}catch(e){el('status').textContent='Error: '+e.message}if(active&&id===serial)setTimeout(()=>recognize(id),30)}
el('start').onclick=async()=>{try{started=performance.now();first=false;const id=++serial;el('result').textContent='—';el('time').textContent='First OCR text: —';el('status').textContent='Opening camera…';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false});const v=el('camera');v.srcObject=stream;await v.play();active=true;el('start').disabled=true;el('stop').disabled=false;recognize(id)}catch(e){el('status').textContent='Error: '+e.message}};
el('stop').onclick=()=>{active=false;serial++;stream?.getTracks().forEach(t=>t.stop());stream=null;el('camera').srcObject=null;el('start').disabled=false;el('stop').disabled=true;el('status').textContent='Stopped'};
</script></body></html>
