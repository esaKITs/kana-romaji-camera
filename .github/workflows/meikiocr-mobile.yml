name: Build MeikiOCR mobile test
on:
  workflow_dispatch:
  push:
    branches: [meikiocr-mobile-experiment]
    paths: ['meikiocr-test/**', '.github/workflows/meikiocr-mobile.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: meikiocr-test
        run: npm ci
      - name: Build and verify pinned models and runtime
        working-directory: meikiocr-test
        run: npm run build
      - name: Controller and adapter regression tests
        working-directory: meikiocr-test
        run: npm test
      - name: OpenCV real movement, rotation and object-change regressions
        working-directory: meikiocr-test
        run: OPENCV_JS=./public/vendor/opencv.js node scripts/opencv-test.cjs
      - name: Install browser test runtimes
        working-directory: meikiocr-test
        run: npx playwright install --with-deps chromium webkit
      - name: Portrait camera controls, scrolling and light-toggle interface
        working-directory: meikiocr-test
        run: node scripts/controls-browser-test.mjs
      - name: Chromium actual Worker and camera-stream integration
        working-directory: meikiocr-test
        run: node scripts/browser-test.mjs
      - name: WebKit actual Worker and source-image inference (camera unverified)
        working-directory: meikiocr-test
        run: BROWSER=webkit node scripts/engine-browser-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meikiocr-mobile-test
          path: |
            meikiocr-test/dist
            meikiocr-test/tests/*browser-results.json
            meikiocr-test/tests/*-live.png
